name: Build and Release Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

  build-desktop-tauri:
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux C/C++ & WebKit dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install npm dependencies
        run: npm install

      - name: Download Target Sidecar Binaries (yt-dlp, ffmpeg, deno) - Unix
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin

          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            curl -L --retry 3 --retry-delay 5 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o src-tauri/bin/yt-dlp-aarch64-apple-darwin
            curl -L --retry 3 --retry-delay 5 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o src-tauri/bin/yt-dlp-x86_64-apple-darwin

            # deno: JavaScript runtime used by yt-dlp to solve YouTube EJS challenges
            curl -L --retry 3 --retry-delay 5 https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip -o /tmp/deno-arm.zip
            curl -L --retry 3 --retry-delay 5 https://github.com/denoland/deno/releases/latest/download/deno-x86_64-apple-darwin.zip -o /tmp/deno-x64.zip
            unzip -o /tmp/deno-arm.zip -d /tmp/deno-arm
            unzip -o /tmp/deno-x64.zip -d /tmp/deno-x64
            cp /tmp/deno-arm/deno src-tauri/bin/deno-aarch64-apple-darwin
            cp /tmp/deno-x64/deno src-tauri/bin/deno-x86_64-apple-darwin

            # ffmpeg: static builds from the ffmpeg-static release (evermeet.cx
            # returns an HTML page, not a zip, so it broke the macOS job)
            curl -L --retry 3 --retry-delay 5 https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz -o /tmp/ffmpeg-arm.gz
            curl -L --retry 3 --retry-delay 5 https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64.gz -o /tmp/ffmpeg-x64.gz
            gunzip -c /tmp/ffmpeg-arm.gz > src-tauri/bin/ffmpeg-aarch64-apple-darwin
            gunzip -c /tmp/ffmpeg-x64.gz > src-tauri/bin/ffmpeg-x86_64-apple-darwin
          else
            curl -L --retry 3 --retry-delay 5 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o src-tauri/bin/yt-dlp-x86_64-unknown-linux-gnu

            # deno
            curl -L --retry 3 --retry-delay 5 https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip
            unzip -o /tmp/deno.zip -d /tmp/deno
            cp /tmp/deno/deno src-tauri/bin/deno-x86_64-unknown-linux-gnu

            # ffmpeg: static build
            curl -L --retry 3 --retry-delay 5 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
            mkdir -p /tmp/ffmpeg
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            cp /tmp/ffmpeg/ffmpeg src-tauri/bin/ffmpeg-x86_64-unknown-linux-gnu
          fi

          chmod +x src-tauri/bin/*
          ls -lh src-tauri/bin

      - name: Download Target Sidecar Binaries (yt-dlp, ffmpeg, deno) - Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null

          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe"

          # deno: JavaScript runtime used by yt-dlp to solve YouTube EJS challenges
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP/deno.zip"
          Expand-Archive -Path "$env:TEMP/deno.zip" -DestinationPath "$env:TEMP/deno" -Force
          Copy-Item "$env:TEMP/deno/deno.exe" "src-tauri/bin/deno-x86_64-pc-windows-msvc.exe"

          # ffmpeg: static GPL build
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile "$env:TEMP/ffmpeg.zip"
          Expand-Archive -Path "$env:TEMP/ffmpeg.zip" -DestinationPath "$env:TEMP/ffmpeg" -Force
          $ffmpeg = Get-ChildItem "$env:TEMP/ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName "src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe"

          Get-ChildItem src-tauri/bin | Format-Table Name, Length

      - name: Build Web Export for Tauri
        run: npm run build:tauri

      - name: Build Tauri Desktop (MSI, EXE, DMG, APP, DEB, AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Media Grabber v__VERSION__'
          releaseBody: 'Downloadable Desktop & Mobile Release Artifacts (.msi, .exe, .dmg, .apk, .aab, .deb)'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and Package MSIX for Microsoft Store
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          $msixVersion = "$pkgVersion.0"
          Write-Host "Preparing MSIX package for version: $msixVersion"
          
          $packDir = "$env:RUNNER_TEMP\MediaGrabberPack"
          New-Item -ItemType Directory -Path "$packDir\Assets" -Force | Out-Null

          Copy-Item "src-tauri\target\release\media-grabber.exe" -Destination "$packDir\media-grabber.exe" -Force
          Copy-Item "src-tauri\bin\yt-dlp-x86_64-pc-windows-msvc.exe" -Destination "$packDir\yt-dlp.exe" -Force
          Copy-Item "src-tauri\icons\*" -Destination "$packDir\Assets" -Recurse -Force

          $manifestPath = "$packDir\AppxManifest.xml"
          Copy-Item "src-tauri\msix\AppxManifest.xml" -Destination $manifestPath -Force
          $manifestXml = [xml](Get-Content $manifestPath)
          $manifestXml.Package.Identity.Version = $msixVersion
          $manifestXml.Save($manifestPath)

          $makeappx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Select-Object -Last 1).FullName
          Write-Host "Using makeappx: $makeappx"
          $outputMsix = "MediaGrabber_${pkgVersion}_x64.msix"
          & $makeappx pack /d "$packDir" /p "$outputMsix" /nv /o

          Write-Host "Uploading $outputMsix to GitHub Release app-v$pkgVersion..."
          gh release upload "app-v$pkgVersion" "$outputMsix" --clobber

      - name: Upload Desktop Installer Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            *.msix

  build-android-tauri:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Export for Tauri
        run: npm run build:tauri

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: media-grabber-web-build
          path: dist/

name: Build and Release Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

  build-desktop-tauri:
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux C/C++ & WebKit dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install npm dependencies
        run: npm install

      - name: Download Target Sidecar Binaries (yt-dlp)
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o src-tauri/bin/yt-dlp-aarch64-apple-darwin
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o src-tauri/bin/yt-dlp-x86_64-apple-darwin
            chmod +x src-tauri/bin/yt-dlp-aarch64-apple-darwin src-tauri/bin/yt-dlp-x86_64-apple-darwin
          elif [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o src-tauri/bin/yt-dlp-x86_64-unknown-linux-gnu
            chmod +x src-tauri/bin/yt-dlp-x86_64-unknown-linux-gnu
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe
          fi

      - name: Build Web Export for Tauri
        run: npm run build:tauri

      - name: Build Tauri Desktop (MSI, EXE, DMG, APP, DEB, AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Media Grabber v__VERSION__'
          releaseBody: 'Downloadable Desktop & Mobile Release Artifacts (.msi, .exe, .dmg, .apk, .aab, .deb)'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and Package MSIX for Microsoft Store
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          $msixVersion = "$pkgVersion.0"
          Write-Host "Preparing MSIX package for version: $msixVersion"
          
          $packDir = "$env:RUNNER_TEMP\MediaGrabberPack"
          New-Item -ItemType Directory -Path "$packDir\Assets" -Force | Out-Null

          Copy-Item "src-tauri\target\release\media-grabber.exe" -Destination "$packDir\media-grabber.exe" -Force
          Copy-Item "src-tauri\bin\yt-dlp-x86_64-pc-windows-msvc.exe" -Destination "$packDir\yt-dlp.exe" -Force
          Copy-Item "src-tauri\icons\*" -Destination "$packDir\Assets" -Recurse -Force

          $manifestPath = "$packDir\AppxManifest.xml"
          Copy-Item "src-tauri\msix\AppxManifest.xml" -Destination $manifestPath -Force
          $manifestXml = [xml](Get-Content $manifestPath)
          $manifestXml.Package.Identity.Version = $msixVersion
          $manifestXml.Save($manifestPath)

          $makeappx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Select-Object -Last 1).FullName
          Write-Host "Using makeappx: $makeappx"
          $outputMsix = "MediaGrabber_${pkgVersion}_x64.msix"
          & $makeappx pack /d "$packDir" /p "$outputMsix" /nv /o

          Write-Host "Uploading $outputMsix to GitHub Release app-v$pkgVersion..."
          gh release upload "app-v$pkgVersion" "$outputMsix" --clobber

      - name: Upload Desktop Installer Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            *.msix

  build-android-tauri:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Export for Tauri
        run: npm run build:tauri

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: media-grabber-web-build
          path: dist/

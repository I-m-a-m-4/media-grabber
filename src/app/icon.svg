<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Orange Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#orangeGrad)"/>
  
  <!-- White Universal Media Grabber Emblem -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Media Ring Arc -->
    <path d="M 140 240 A 136 136 0 1 1 372 240" stroke-width="32" />
    
    <!-- Downward Download Arrow -->
    <line x1="256" y1="120" x2="256" y2="304" stroke-width="36" />
    <polyline points="184,232 256,304 328,232" stroke-width="36" />
    
    <!-- Tray Base -->
    <line x1="152" y1="376" x2="360" y2="376" stroke-width="36" />
  </g>
</svg>
